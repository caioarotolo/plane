name: OpenMarkets app build and deploy
on:
  push:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmarkets-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    if: github.repository == 'caioarotolo/plane' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: apps/web/Dockerfile.web
          - component: admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - component: space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - component: live
            context: .
            dockerfile: apps/live/Dockerfile.live
          - component: backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - component: proxy
            context: apps/proxy
            dockerfile: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/caioarotolo/plane-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/caioarotolo/plane
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=plane-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=plane-${{ matrix.component }}
  deploy:
    needs: [images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/preview' && github.repository == 'caioarotolo/plane'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://planner.openmarkets.com.br
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy verified images to VPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: bash deployments/openmarkets/deploy-vps.sh
      - name: Check public app and OAuth discovery
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://planner.openmarkets.com.br/api/instances/ > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://planner.openmarkets.com.br/.well-known/oauth-authorization-server > /dev/null
