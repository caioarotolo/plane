name: OpenMarkets app CI and deploy
on:
  push:
    branches: [preview]
  pull_request:
    branches: [preview]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openmarkets-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web-checks:
    if: github.repository == 'caioarotolo/plane'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check:lint check:types test
      - run: python3 -m unittest discover -s deployments/openmarkets/tests -v
  api-tests:
    if: github.repository == 'caioarotolo/plane'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated test environment
        run: |
          cp apps/api/.env.example apps/api/.env
          python3 - <<'PY'
          import secrets
          with open('apps/api/.env', 'a') as f:
              f.write('\nSECRET_KEY=' + secrets.token_hex(32) + '\n')
          PY
      - name: API lint and tests
        run: >-
          docker compose -f docker-compose-test.yml run --build --rm api-tests
          sh -c 'uv run --no-sync ruff check . && pytest -q -o addopts="--strict-markers --nomigrations"'
      - name: Remove test stack
        if: always()
        run: docker compose -f docker-compose-test.yml down -v
  images:
    if: github.repository == 'caioarotolo/plane'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: apps/web/Dockerfile.web
          - component: admin
            context: .
            dockerfile: apps/admin/Dockerfile.admin
          - component: space
            context: .
            dockerfile: apps/space/Dockerfile.space
          - component: live
            context: .
            dockerfile: apps/live/Dockerfile.live
          - component: backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
          - component: proxy
            context: apps/proxy
            dockerfile: apps/proxy/Dockerfile.ce
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/preview'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/preview' }}
          tags: ghcr.io/caioarotolo/plane-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/caioarotolo/plane
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=plane-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=plane-${{ matrix.component }}
  deploy:
    needs: [web-checks, api-tests, images]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/preview' && github.repository == 'caioarotolo/plane'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://planner.openmarkets.com.br
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy verified images to VPS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: bash deployments/openmarkets/deploy-vps.sh
      - name: Check public app and OAuth discovery
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://planner.openmarkets.com.br/api/instances/ > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://planner.openmarkets.com.br/.well-known/oauth-authorization-server > /dev/null
